<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Saddam Hossain · MuleSoft integration architect</title>
    <meta name="description" content="Portfolio and blog of Saddam Hossain, MuleSoft integration and architecture consultant." />
    <!-- Mirrors initialTheme() in src/lib/theme.ts; runs before paint to avoid a light flash in dark mode. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta property="og:site_name" content="Saddam Hossain" />
    <meta name="theme-color" content="#12355b" />
    <link rel="alternate" type="application/rss+xml" title="Blog" href="/rss.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
